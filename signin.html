<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolHub237 - Sign Up</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="auth-container">
    <h1>SchoolHub237</h1>

    <form id="signup-form">
      <h2>Create an Account</h2>

      <div class="input-group">
        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" placeholder="John Doe" required>
      </div>

      <div class="input-group">
        <label for="signup-email">Email Address</label>
        <input type="email" id="signup-email" placeholder="e.g. user@gmail.com" required>
      </div>

      <div class="input-group password-group">
        <label for="signup-password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="signup-password" placeholder="Choose a password" required>
          <i class="fa-solid fa-eye toggle-password"></i>
        </div>
      </div>

      <div class="input-group">
        <label for="account-type">Account Type</label>
        <select id="account-type" required>
          <option value="" disabled selected>Select account type</option>
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
          <option value="parent">Parent</option>
        </select>
      </div>

      <button type="submit" class="btn">Sign Up</button>

      <p class="auth-switch">
        Already have an account? <a href="index.html">Log In</a>
      </p>
    </form>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
