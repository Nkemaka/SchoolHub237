<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolHub237 - Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Welcome to SchoolHub237</h1>

  <!-- Sign Up Form -->
  <div id="signup-container">
    <h2>Create an Account</h2>
    <form id="signup-form">
      <input type="text" id="signup-name" placeholder="Full Name" required /><br><br>
      <input type="email" id="signup-email" placeholder="Email" required /><br><br>
      <input type="password" id="signup-password" placeholder="Password (6+ chars)" required /><br><br>
      
      <label for="user-role">Account Type:</label>
      <select id="user-role">
        <option value="student">Student</option>
        <option value="school_admin">School Administrator</option>
      </select><br><br>
      
      <button type="submit">Sign Up</button>
    </form>
  </div>

  <hr>

  <!-- Login Form -->
  <div id="login-container">
    <h2>Log In</h2>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required /><br><br>
      <input type="password" id="login-password" placeholder="Password" required /><br><br>
      <button type="submit">Log In</button>
    </form>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
