<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SchoolHub237 - Log In</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Login Container Only -->
  <div id="login-container">
    <h2>Log In</h2>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required /><br><br>
      <input type="password" id="login-password" placeholder="Password" required /><br><br>
      <button type="submit">Log In</button>
    </form>
    <p>Don't have an account? <a href="signin.html">Sign Up here</a></p>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
